<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Riemannian gradient descent path on a sphere toward a target point">
  <g transform="translate(14 0)">
  <!-- sphere -->
  <circle cx="108" cy="78" r="54" fill="var(--thumb-fill-1)" stroke="var(--accent)" stroke-width="1.5"/>
  <g fill="none" stroke="var(--thumb-line)" stroke-width="1.1">
    <ellipse cx="108" cy="78" rx="54" ry="17"/>
    <ellipse cx="108" cy="78" rx="20" ry="54"/>
    <path d="M60 52 Q108 64 156 52"/>
    <path d="M60 104 Q108 116 156 104"/>
  </g>
  <!-- geodesic descent path -->
  <path d="M74 42 Q 92 58 104 66 T 132 92" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="1 6" stroke-linecap="round"/>
  <circle cx="74" cy="42" r="3.8" fill="var(--accent)" opacity=".55"/>
  <circle cx="132" cy="92" r="5.2" fill="var(--accent)"/>
  <!-- tangent step -->
  <path d="M104 66 l 18 4" stroke="var(--accent-2)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M122 70 l -5 -4 M122 70 l -6 3" stroke="var(--accent-2)" stroke-width="1.6" stroke-linecap="round"/>
  <text x="138" y="104" font-size="11" fill="var(--muted)" font-style="italic">x&#9733;</text>
  </g>
  <g font-size="10.5" fill="var(--muted)" font-style="italic">
    <text x="176" y="32">noise</text>
    <text x="176" y="44">robust</text>
  </g>
  <g fill="var(--accent-2)" opacity=".6">
    <circle cx="200" cy="58" r="1.6"/><circle cx="208" cy="64" r="1.3"/><circle cx="195" cy="68" r="1.4"/>
    <circle cx="212" cy="54" r="1.2"/><circle cx="203" cy="72" r="1.1"/>
  </g>
</svg>
