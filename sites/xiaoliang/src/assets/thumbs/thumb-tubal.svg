<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fourier-domain frontal slices with different ranks next to a saddle surface">
  <!-- Fourier slices of a third-order tensor -->
  <g transform="translate(14 6)">
  <g stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round">
    <path d="M34 34 L90 34 L90 92 L34 92 Z" fill="var(--thumb-fill-1)" opacity=".55"/>
    <path d="M44 44 L100 44 L100 102 L44 102 Z" fill="var(--thumb-fill-2)" opacity=".7"/>
    <path d="M54 54 L110 54 L110 112 L54 112 Z" fill="var(--thumb-fill-3)" opacity=".85"/>
    <path d="M64 64 L120 64 L120 122 L64 122 Z" fill="var(--thumb-fill-1)"/>
  </g>
  <g font-size="10" fill="var(--muted)" font-style="italic" text-anchor="middle">
    <text x="92" y="97">r&#8321;=2</text>
  </g>
  <g font-size="9" fill="var(--muted)" font-style="italic">
    <text x="124" y="60">r&#8322;=2</text>
    <text x="114" y="50">r&#8323;=1</text>
    <text x="104" y="40">r&#8324;=3</text>
  </g>
  </g>
  <!-- saddle -->
  <g fill="none" stroke-linecap="round">
    <path d="M150 104 Q 186 70 222 104" stroke="var(--thumb-line)" stroke-width="1.4"/>
    <path d="M160 58 Q 186 104 212 58" stroke="var(--accent-2)" stroke-width="1.8"/>
    <path d="M154 92 Q 186 66 218 92" stroke="var(--thumb-line)" stroke-width="1" opacity=".7"/>
  </g>
  <circle cx="186" cy="81" r="4.5" fill="var(--accent)"/>
  <path d="M186 81 l -10 -16" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="1 4" stroke-linecap="round"/>
  <text x="186" y="128" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-style="italic">strict saddle</text>
</svg>
