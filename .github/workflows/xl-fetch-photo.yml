name: Fetch Xiao Liang portrait (one-off)

on:
  push:
    paths:
      - .github/workflows/xl-fetch-photo.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize portrait
        run: |
          curl -fsSL -A "Mozilla/5.0" -o /tmp/XL.jpg https://www.ece.iastate.edu/~lishuang/pictures/XL.jpg
          file /tmp/XL.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image, ImageOps
          im = ImageOps.exif_transpose(Image.open('/tmp/XL.jpg')).convert('RGB')
          im = ImageOps.fit(im, (440, 542), method=Image.LANCZOS, centering=(0.5, 0.35))
          im.save('xiaoliang/assets/avatar.jpg', quality=86, optimize=True, progressive=True)
          print(im.size)
          EOF
      - name: Commit portrait and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xiaoliang/assets/avatar.jpg
          git rm -q .github/workflows/xl-fetch-photo.yml
          git commit -m "Add Xiao Liang portrait"
          git push
