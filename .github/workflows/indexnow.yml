# Notify IndexNow (Bing, Yandex, Seznam, Naver; Bing powers ChatGPT search / Copilot results)
# after each successful GitHub Pages build, so updated pages are recrawled quickly.
name: IndexNow ping

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          HOST: danielye.net
          KEY: d48e99ff3f3e2223b56b1152af5fe7c8
        run: |
          sleep 30
          urls=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -sc .)
          echo "URLs: $urls"
          body=$(jq -nc --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" \
            '{host:$host, key:$key, keyLocation:("https://"+$host+"/"+$key+".txt"), urlList:$urls}')
          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST "https://api.indexnow.org/IndexNow" \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow HTTP $code"; cat resp.txt || true
          case "$code" in 200|202) exit 0;; *) exit 1;; esac
