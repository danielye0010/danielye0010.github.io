# Main research papers (shown as cards with an illustration).
research:
  - id: tubal
    title: Strict-Saddle Landscapes and Multi-Rank Geometry in Low-Tubal-Rank Tensor Sensing
    authors: "Eugene Agyei-Kodie<sup>*</sup>, Longxiu Huang<sup>*</sup>, Shuang Li<sup>&dagger;</sup>, <b>Xiao Liang</b><sup>&dagger;</sup>"
    venue: arXiv preprint, 2026
    badge: Preprint
    year: 2026
    thumb: tubal
    note: "<sup>*</sup>, <sup>&dagger;</sup> equal contribution"
    tldr: >-
      Under a tubal restricted isometry condition, the balanced factorized objective has no spurious local
      minima and a quantitative strict-saddle structure. Its local geometry is governed by the ranks of the
      Fourier slices, not by the tubal rank alone.
    links:
      - { label: arXiv, url: "https://arxiv.org/abs/2609.37865" }
      - { label: PDF, url: "https://arxiv.org/pdf/2609.37865" }
    bibtex: |-
      @article{agyeikodie2026strict,
        title   = {Strict-Saddle Landscapes and Multi-Rank Geometry in Low-Tubal-Rank Tensor Sensing},
        author  = {Agyei-Kodie, Eugene and Huang, Longxiu and Li, Shuang and Liang, Xiao},
        journal = {arXiv preprint arXiv:2609.37865},
        year    = {2026}
      }

  - id: lsrtrm
    title: A Muon-Accelerated Algorithm for Low Separation Rank Tensor Generalized Linear Models
    authors: "<b>Xiao Liang</b>, Shuang Li"
    venue: arXiv preprint, 2026
    badge: Preprint
    year: 2026
    thumb: muon
    note: ""
    tldr: >-
      LSRTR-M replaces the QR-based projection steps of LSRTR with Muon (momentum orthogonalized by
      Newton&ndash;Schulz) updates. On linear, logistic, and Poisson tensor GLMs it converges faster in both
      iterations and wall-clock time, and it stays competitive on Vessel MNIST 3D classification.
    links:
      - { label: arXiv, url: "https://arxiv.org/abs/2604.04726" }
      - { label: PDF, url: "https://arxiv.org/pdf/2604.04726" }
      - { label: Code, url: "https://github.com/EliaLiang/LSRTR-M" }
    bibtex: |-
      @article{liang2026muon,
        title   = {A Muon-Accelerated Algorithm for Low Separation Rank Tensor Generalized Linear Models},
        author  = {Liang, Xiao and Li, Shuang},
        journal = {arXiv preprint arXiv:2604.04726},
        year    = {2026}
      }

  - id: bdpr-icassp
    title: Landscape Analysis of Simultaneous Blind Deconvolution and Phase Retrieval
    authors: "<b>Xiao Liang</b>, Zhen Qin, Zhihui Zhu, Shuang Li"
    venue: IEEE International Conference on Acoustics, Speech and Signal Processing (ICASSP), Barcelona, 2026
    badge: ICASSP 2026
    year: 2026
    thumb: landscape
    note: ""
    tldr: >-
      Blind deconvolution and phase retrieval, solved at the same time, become a structured low-rank tensor
      recovery problem. For a tractable surrogate, the paper characterizes the global landscape of the
      population risk on the sphere and shows that Riemannian gradient descent converges linearly.
    links:
      - { label: Paper, url: "https://ieeexplore.ieee.org/document/11461778" }
      - { label: DOI, url: "https://doi.org/10.1109/ICASSP55912.2026.11461778" }
    bibtex: |-
      @inproceedings{liang2026landscape,
        title     = {Landscape Analysis of Simultaneous Blind Deconvolution and Phase Retrieval},
        author    = {Liang, Xiao and Qin, Zhen and Zhu, Zhihui and Li, Shuang},
        booktitle = {IEEE International Conference on Acoustics, Speech and Signal Processing (ICASSP)},
        pages     = {511--515},
        year      = {2026},
        doi       = {10.1109/ICASSP55912.2026.11461778}
      }

  - id: bdpr-tensor
    title: Landscape Analysis of Simultaneous Blind Deconvolution and Phase Retrieval via Structured Low-Rank Tensor Recovery
    authors: "<b>Xiao Liang</b><sup>*</sup>, Zhen Qin<sup>*</sup>, Zhihui Zhu, Shuang Li"
    venue: arXiv preprint, 2025
    badge: Preprint
    year: 2025
    thumb: sphere
    note: "<sup>*</sup> equal contribution"
    tldr: >-
      The full story behind the ICASSP paper. Beyond the global landscape of the population surrogate, it
      establishes local geometry, convergence guarantees, and robustness to measurement noise for the full
      tensor sensing problem, with experiments that point the way back to the original problem.
    links:
      - { label: arXiv, url: "https://arxiv.org/abs/2509.10834" }
      - { label: PDF, url: "https://arxiv.org/pdf/2509.10834" }
    bibtex: |-
      @article{liang2025landscape,
        title   = {Landscape Analysis of Simultaneous Blind Deconvolution and Phase Retrieval via Structured Low-Rank Tensor Recovery},
        author  = {Liang, Xiao and Qin, Zhen and Zhu, Zhihui and Li, Shuang},
        journal = {arXiv preprint arXiv:2509.10834},
        year    = {2025}
      }

